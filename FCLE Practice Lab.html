  const saved = loadSession();
  const rd = readiness();
  const agg = recentTopicStats(5);
  const hasData = DB.attempts.length > 0;
  return `
  <header class="masthead">
    <div>
      <p class="eyebrow">Florida Civic Literacy Examination</p>
      <h1>FCLE Practice Lab</h1>
      <p class="lede">80 questions in the official format, scored against the real passing line of 60% (48 of 80). After each test you get a breakdown of where you lost points and what to revise.</p>
    </div>
  </header>

  ${saved ? `<section class="panel resume">
    <div><strong>You have a test in progress.</strong><br><span class="muted">${esc(saved.label)} · ${Object.keys(saved.ans).length} of ${saved.qs.length} answered</span></div>
    <div class="row"><button class="btn primary" data-act="resume">Resume</button><button class="btn ghost" data-act="discard">Discard</button></div>
  </section>` : ""}

  <section class="ready panel">
    ${rd ? `
      <div class="ready-score"><span class="num">${rd.p}%</span><span class="muted small">avg. of last ${rd.count} attempt${rd.count > 1 ? "s" : ""}</span></div>
      <div class="ready-text"><span class="pill ${rd.cls}">${rd.label}</span><p>${rd.note}</p>${bar(rd.p, { mark: true })}<p class="small muted">Line marks the 60% passing score.</p></div>
    ` : `
      <div class="ready-text"><span class="pill none">No score yet</span><p>Start with the full practice exam. It gives you a baseline score and shows exactly which of the 19 topics need work.</p></div>
    `}
  </section>

  <h2 class="section-h">Choose a test</h2>
  <div class="modes">
    <article class="mode feature">
      <p class="eyebrow">Recommended first</p>
      <h3>Full practice exam</h3>
      <p>80 questions, 160-minute timer, 20 per competency. No answers until the end, just like test day.</p>
      <button class="btn primary" data-act="start-exam">Start exam</button>
    </article>
    <article class="mode">
      <h3>Quick quiz</h3>
      <p>20 mixed questions, 5 from each competency. Explanations after every answer.</p>
      <button class="btn" data-act="start-quiz">Start quiz</button>
    </article>
    <article class="mode">
      <h3>Weak-spot drill</h3>
      <p>${hasData ? "20 questions pulled from your lowest-scoring topics, starting with ones you missed." : "Unlocks after your first test. It targets the topics you score lowest on."}</p>
      <button class="btn" data-act="start-weak" ${hasData ? "" : "disabled"}>Start drill</button>
    </article>
  </div>

  <h2 class="section-h">Practice one competency</h2>
  <div class="comps">
    ${[1,2,3,4].map(c => `<button class="comp-btn" data-act="start-comp" data-c="${c}"><span class="cn">Competency ${c}</span><span class="ct">${COMPS[c]}</span><span class="small muted">20 questions · with explanations</span></button>`).join("")}
  </div>

  <h2 class="section-h">Topic mastery ${hasData ? `<span class="small muted">from your last ${Math.min(5, DB.attempts.length)} attempt${DB.attempts.length > 1 ? "s" : ""}</span>` : ""}</h2>
  <div class="mastery">
    ${[1,2,3,4].map(c => `
      <div class="m-comp">
        <h4>${COMPS[c]}</h4>
        ${Object.entries(TOPICS).filter(([, v]) => v.c === c).map(([t, v]) => {
          const s = agg[t]; const p = s ? pct(...s) : 0; const st = status(p, s ? s[1] : 0);
          return `<button class="m-row" data-act="start-topic" data-t="${t}" title="Drill this topic">
            <span class="m-name">${v.name}</span>
            <span class="m-bar">${s ? bar(p) : `<div class="bar none"><span style="width:0"></span></div>`}</span>
            <span class="m-val ${st.cls}">${s ? p + "%" : "—"}</span>
          </button>`;
        }).join("")}
      </div>`).join("")}
  </div>
  <p class="small muted">Tap any topic to drill just that topic.</p>

  ${hasData ? `
  <h2 class="section-h">Your attempts</h2>
  <ol class="history">
    ${DB.attempts.slice().reverse().map(a => { const p = pct(a.correct, a.total); const st = p >= PASS ? "good" : "bad"; return `
      <li><button class="h-row" data-act="view-attempt" data-k="${a.k}">
        <span class="h-label"><strong>${esc(a.label)}</strong><span class="small muted">${fmtDate(a.date)}</span></span>
        <span class="h-score"><span class="num">${p}%</span><span class="small muted">${a.correct}/${a.total}</span></span>
        <span class="pill ${st}">${p >= PASS ? "Pass" : "Below 60%"}</span>
      </button></li>`; }).join("")}
  </ol>
  <div class="row">${confirmClear
    ? `<span class="small">Delete all scores and history from this browser?</span><button class="btn danger" data-act="clear-yes">Delete history</button><button class="btn ghost" data-act="clear-no">Cancel</button>`
    : `<button class="btn ghost small-btn" data-act="clear-ask">Clear history</button>`}</div>` : ""}

  <footer class="foot small muted">
    <p>These are original practice questions written to match the style of the Florida Department of Education’s FCLE sample items: primary-source passages, scenarios, and recall across the four competencies. The real exam uses different questions. Your progress is saved in this browser only.</p>
  </footer>`;
}

function testView(){
  const x = S.qs[S.idx]; const b = byId[x.id];
  const chosen = S.ans[x.id]; const checked = S.feedback && S.checked[x.id];
  const answered = Object.keys(S.ans).length;
  const comp = TOPICS[b.t].c;
  const confirming = view === "confirm-finish";
  const unanswered = S.qs.length - answered;
  return `
  <div class="testbar">
    <div class="tb-inner">
      <div class="tb-left"><strong>${esc(S.label)}</strong><span class="small muted">Question ${S.idx + 1} of ${S.qs.length} · ${answered} answered</span></div>
      <div class="tb-right">
        <span class="clock" aria-label="${S.limit ? "Time remaining" : "Time elapsed"}"><span class="small muted">${S.limit ? "Left" : "Time"}</span> <span id="clock">${S.limit ? fmtTime(S.limit - elapsedNow()) : fmtTime(elapsedNow())}</span></span>
        <button class="btn small-btn" data-act="toggle-nav" aria-expanded="${navOpen}">${navOpen ? "Hide" : "All"} questions</button>
        <button class="btn primary small-btn" data-act="finish-ask">Finish</button>
      </div>
    </div>
    <div class="progress"><span style="width:${pct(answered, S.qs.length)}%"></span></div>
  </div>

  ${confirming ? `<div class="panel confirm">
    <p><strong>Finish and score this test?</strong> ${unanswered ? `You have ${unanswered} unanswered question${unanswered > 1 ? "s" : ""}; they will be marked wrong. On the real FCLE there is no penalty for guessing, so answer every question.` : "You have answered every question."}</p>
    <div class="row"><button class="btn primary" data-act="finish-yes">Score my test</button><button class="btn ghost" data-act="finish-no">Keep working</button></div>
  </div>` : ""}

  ${S.limit && S.halfShown && S.elapsed < S.limit / 2 + 300 ? `<div class="panel note small">Halfway through the time. The real FCLE allows a break at 80 minutes, so stand up and stretch if you need to.</div>` : ""}

  ${navOpen ? `<div class="panel navgrid">
    ${S.qs.map((q, i) => `<button class="nav-cell ${S.ans[q.id] !== undefined ? "done" : ""} ${S.flags[q.id] ? "flag" : ""} ${i === S.idx ? "cur" : ""}" data-act="goto" data-n="${i}" aria-label="Question ${i + 1}">${i + 1}</button>`).join("")}
    <p class="small muted legend"><span class="sw done"></span>Answered <span class="sw flag"></span>Flagged <span class="sw"></span>Not answered</p>
  </div>` : ""}

  <div class="qwrap ${b.p ? "has-p" : ""}">
    ${b.p ? `<aside class="passage">
      <p class="p-label">${b.s === "source" ? "Use the passage below to answer the question" : "Use the information below to answer the question"}</p>
      <blockquote>${esc(b.p).replace(/\n/g, "<br>")}</blockquote>
      <p class="p-src">${b.s === "source" ? "Source: " : ""}${esc(b.src)}</p>
    </aside>` : ""}
    <section class="question">
      <p class="q-meta small muted">Competency ${comp} · ${COMPS[comp]}</p>
      <h2 class="q-stem">${S.idx + 1}. ${esc(b.q)}</h2>
      <div class="opts" role="radiogroup">
        ${x.order.map((oi, k) => {
          let cls = "";
          if (chosen === oi) cls += " chosen";
          if (checked) { if (oi === b.a) cls += " right"; else if (chosen === oi) cls += " wrong"; }
          return `<button class="opt${cls}" role="radio" aria-checked="${chosen === oi}" data-act="choose" data-i="${oi}" ${checked ? "disabled" : ""}><span class="letter">${LETTERS[k]}</span><span>${esc(b.o[oi])}</span></button>`;
        }).join("")}
      </div>
      ${checked ? `<div class="feedback ${chosen === b.a ? "good" : "bad"}">
        <p><strong>${chosen === b.a ? "Correct." : "Not quite. The answer is " + LETTERS[x.order.indexOf(b.a)] + "."}</strong> ${esc(b.e)}</p>
        <p class="small muted">Topic: ${TOPICS[b.t].name}</p>
      </div>` : ""}
      <div class="qnav">
        <button class="btn ghost" data-act="prev" ${S.idx === 0 ? "disabled" : ""}>Previous</button>
        <button class="btn ghost flagbtn ${S.flags[x.id] ? "on" : ""}" data-act="flag" aria-pressed="${!!S.flags[x.id]}">${S.flags[x.id] ? "Flagged" : "Flag for review"}</button>
        ${S.idx < S.qs.length - 1 ? `<button class="btn primary" data-act="next">Next</button>` : `<button class="btn primary" data-act="finish-ask">Finish test</button>`}
      </div>
      <p class="small muted keys">Keys: A–D to answer, ← → to move${S.feedback ? "" : ", F to flag"}.</p>
    </section>
  </div>`;
}

function resultsView(a){
  const p = pct(a.correct, a.total);
  const passed = p >= PASS;
  const need = Math.ceil(a.total * PASS / 100);
  const topics = Object.entries(a.byTopic).map(([t, [c, n]]) => ({ t, c, n, p: pct(c, n) })).sort((x, y) => x.p - y.p || y.n - x.n);
  const weak = topics.filter(x => x.p < 80).slice(0, 3);
  const styles = Object.entries(a.byStyle).map(([s, [c, n]]) => ({ s, c, n, p: pct(c, n) })).sort((x, y) => x.p - y.p);
  const weakStyle = styles.length > 1 && styles[0].p < 80 ? styles[0] : null;
  const perQ = a.secs / a.total;
  const missed = a.items.filter(i => i.ch !== byId[i.id].a);
  const flagged = a.items.filter(i => i.fl);
  const list = reviewFilter === "missed" ? missed : reviewFilter === "flagged" ? flagged : a.items;
  const margin = a.correct - need;
  const headline = a.total === 80
    ? (passed ? (margin >= 8 ? `You passed with ${margin} questions to spare.` : `You passed, but only by ${margin === 0 ? "the minimum" : margin + " question" + (margin > 1 ? "s" : "")}.`) : `You were ${need - a.correct} correct answer${need - a.correct > 1 ? "s" : ""} short of passing.`)
    : (passed ? "Above the passing line on this set." : "Below the passing line on this set.");

  return `
  <div class="row back"><button class="btn ghost small-btn" data-act="home">← Dashboard</button></div>
  <header class="r-hero panel">
    <div class="r-score">
      <span class="eyebrow">${esc(a.label)} · ${fmtDate(a.date)}</span>
      <span class="big num">${p}%</span>
      <span class="muted">${a.correct} of ${a.total} correct · pass needs ${need} (60%)</span>
    </div>
    <div class="r-sum">
      <span class="pill ${passed ? "good" : "bad"}">${passed ? "Passing score" : "Below passing"}</span>
      <p class="r-head">${headline}</p>
      ${bar(p, { mark: true })}
      <p class="small muted">Time used ${fmtTime(a.secs)} · about ${perQ >= 60 ? (perQ / 60).toFixed(1) + " min" : Math.round(perQ) + " sec"} per question${a.mode === "exam" ? (perQ > 120 ? ". That’s over the real pace of 2 minutes per question." : ". The real pace is 2 minutes per question, so you have room.") : "."}</p>
    </div>
  </header>

  <h2 class="section-h">By competency <span class="small muted">each is about 25% of the real test</span></h2>
  <div class="panel comp-res">
    ${[1,2,3,4].filter(c => a.byComp[c]).map(c => { const [cc, n] = a.byComp[c]; const cp = pct(cc, n); const st = status(cp, n); return `
      <div class="cr-row">
        <span class="cr-name"><span class="small muted">Competency ${c}</span>${COMPS[c]}</span>
        <span class="cr-bar">${bar(cp, { mark: true })}</span>
        <span class="cr-val"><span class="num">${cp}%</span><span class="small muted">${cc}/${n}</span></span>
        <span class="pill ${st.cls}">${st.label}</span>
      </div>`; }).join("")}
  </div>

  ${weak.length ? `
  <h2 class="section-h">Revise these first</h2>
  <div class="revise">
    ${weak.map((w, i) => `<article class="rv panel">
      <div class="rv-head"><span class="rank">${i + 1}</span><div><h3>${TOPICS[w.t].name}</h3><span class="small muted">${COMPS[TOPICS[w.t].c]} · ${w.c}/${w.n} correct (${w.p}%)</span></div></div>
      <p class="small strong">Key points to study</p>
      <ul>${TOPICS[w.t].notes.map(n => `<li>${esc(n)}</li>`).join("")}</ul>
      <button class="btn" data-act="start-topic" data-t="${w.t}">Drill this topic</button>
    </article>`).join("")}
  </div>` : `<div class="panel note">Every topic on this test was 80% or higher. Take another full exam to confirm it, then use the competency drills to stay sharp.</div>`}

  ${weakStyle ? `
  <h2 class="section-h">Question style</h2>
  <div class="panel styles">
    ${styles.map(s => `<div class="cr-row"><span class="cr-name">${STYLES[s.s]}</span><span class="cr-bar">${bar(s.p, { mark: true })}</span><span class="cr-val"><span class="num">${s.p}%</span><span class="small muted">${s.c}/${s.n}</span></span></div>`).join("")}
    <p class="tip"><strong>Your weakest style is ${STYLES[weakStyle.s].toLowerCase()}.</strong> ${STYLE_TIPS[weakStyle.s]}</p>
  </div>` : ""}

  <h2 class="section-h">All topics on this test</h2>
  <div class="panel tbl-wrap">
    <table class="tbl">
      <thead><tr><th>Topic</th><th>Competency</th><th class="r">Score</th><th>Status</th><th></th></tr></thead>
      <tbody>${topics.map(x => { const st = status(x.p, x.n); return `<tr><td>${TOPICS[x.t].name}</td><td class="muted">${TOPICS[x.t].c}</td><td class="r num">${x.c}/${x.n}</td><td><span class="pill ${st.cls}">${st.label}</span></td><td class="r"><button class="link" data-act="start-topic" data-t="${x.t}">Drill</button></td></tr>`; }).join("")}</tbody>
    </table>
  </div>

  <div class="row next-steps">
    ${missed.length ? `<button class="btn primary" data-act="retry-missed" data-k="${a.k}">Retry the ${missed.length} I missed</button>` : ""}
    <button class="btn" data-act="start-weak">Weak-spot drill</button>
    <button class="btn" data-act="start-exam">New full exam</button>
  </div>

  <h2 class="section-h">Review answers</h2>
  <div class="tabs" role="tablist">
    <button role="tab" aria-selected="${reviewFilter === "missed"}" data-act="filter" data-f="missed">Missed (${missed.length})</button>
    <button role="tab" aria-selected="${reviewFilter === "flagged"}" data-act="filter" data-f="flagged">Flagged (${flagged.length})</button>
    <button role="tab" aria-selected="${reviewFilter === "all"}" data-act="filter" data-f="all">All (${a.items.length})</button>
  </div>
  <div class="review">
    ${list.length ? list.map(it => reviewItem(it, a.items.indexOf(it))).join("") : `<p class="muted">Nothing here.</p>`}
  </div>`;
}

function reviewItem(it, n){
  const b = byId[it.id]; const ok = it.ch === b.a;
  return `<article class="rev panel ${ok ? "ok" : "no"}">
    <p class="small muted">Question ${n + 1} · ${TOPICS[b.t].name} · ${STYLES[b.s]}${it.fl ? " · Flagged" : ""}</p>
    ${b.p ? `<blockquote class="rev-p">${esc(b.p).replace(/\n/g, "<br>")}<span class="p-src">${b.s === "source" ? "Source: " : ""}${esc(b.src)}</span></blockquote>` : ""}
    <h3 class="q-stem">${esc(b.q)}</h3>
    <ul class="rev-opts">${it.order.map((oi, k) => {
      const cls = oi === b.a ? "right" : (it.ch === oi ? "wrong" : "");
      const tag = oi === b.a ? "Correct answer" : (it.ch === oi ? "Your answer" : "");
      return `<li class="${cls}"><span class="letter">${LETTERS[k]}</span><span>${esc(b.o[oi])}</span>${tag ? `<em>${tag}</em>` : ""}</li>`;
    }).join("")}</ul>
    ${it.ch === null ? `<p class="small bad-text">You left this one blank.</p>` : ""}
    <p class="expl"><strong>${ok ? "Why it’s right:" : "Why:"}</strong> ${esc(b.e)}</p>
  </article>`;
}

/* ---------- events ---------- */
app.addEventListener("click", e => {
  const el = e.target.closest("[data-act]"); if (!el || el.disabled) return;
  const act = el.dataset.act;
  switch (act) {
    case "start-exam": makeSession("exam", "Full practice exam", shuffle(BANK.map(b => b.id)), false); break;
    case "start-quiz": makeSession("quiz", "Quick quiz", balancedPick(20), true); break;
    case "start-weak": if (DB.attempts.length) makeSession("drill", "Weak-spot drill", weakPick(20), true); break;
    case "start-comp": { const c = +el.dataset.c; makeSession("drill", "Competency " + c + " drill", shuffle(BANK.filter(b => TOPICS[b.t].c === c).map(b => b.id)), true); break; }
    case "start-topic": { const t = el.dataset.t; makeSession("drill", TOPICS[t].name + " drill", shuffle(BANK.filter(b => b.t === t).map(b => b.id)), true); break; }
    case "retry-missed": { const a = DB.attempts.find(x => x.k === +el.dataset.k); if (a) makeSession("drill", "Retry missed questions", shuffle(a.items.filter(i => i.ch !== byId[i.id].a).map(i => i.id)), true); break; }
    case "resume": { S = loadSession(); if (S) { S.startedAt = Date.now() - (S.elapsed || 0) * 1000; view = "test"; startTimer(); render(); } break; }
    case "discard": clearSession(); render(); break;
    case "choose": {
      const x = S.qs[S.idx]; if (S.feedback && S.checked[x.id]) break;
      S.ans[x.id] = +el.dataset.i; if (S.feedback) S.checked[x.id] = true;
      saveSession(); render(); break;
    }
    case "prev": if (S.idx > 0) { S.idx--; saveSession(); render(); window.scrollTo(0, 0); } break;
    case "next": if (S.idx < S.qs.length - 1) { S.idx++; saveSession(); render(); window.scrollTo(0, 0); } break;
    case "goto": S.idx = +el.dataset.n; navOpen = false; saveSession(); render(); window.scrollTo(0, 0); break;
    case "flag": { const id = S.qs[S.idx].id; S.flags[id] = !S.flags[id]; saveSession(); render(); break; }
    case "toggle-nav": navOpen = !navOpen; render(); break;
    case "finish-ask": view = "confirm-finish"; render(); window.scrollTo(0, 0); break;
    case "finish-no": view = "test"; render(); break;
    case "finish-yes": finish(); break;
    case "home": view = "home"; confirmClear = false; render(); window.scrollTo(0, 0); break;
    case "view-attempt": { R = DB.attempts.find(x => x.k === +el.dataset.k); if (R) { reviewFilter = "missed"; view = "results"; render(); window.scrollTo(0, 0); } break; }
    case "filter": reviewFilter = el.dataset.f; render(); break;
    case "clear-ask": confirmClear = true; render(); break;
    case "clear-no": confirmClear = false; render(); break;
    case "clear-yes": DB = { attempts: [], qstats: {} }; saveDB(); confirmClear = false; render(); break;
  }
});

document.addEventListener("keydown", e => {
  if (view !== "test" || !S || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.target.closest && e.target.closest("input,textarea")) return;
  const k = e.key.toLowerCase(); const x = S.qs[S.idx];
  const li = ["a","b","c","d"].indexOf(k);
  if (li >= 0 || ["1","2","3","4"].includes(k)) {
    const pos = li >= 0 ? li : +k - 1;
    if (S.feedback && S.checked[x.id]) return;
    S.ans[x.id] = x.order[pos]; if (S.feedback) S.checked[x.id] = true; saveSession(); render();
  } else if (e.key === "ArrowRight") { if (S.idx < S.qs.length - 1) { S.idx++; saveSession(); render(); } }
  else if (e.key === "ArrowLeft") { if (S.idx > 0) { S.idx--; saveSession(); render(); } }
  else if (k === "f" && !S.feedback) { S.flags[x.id] = !S.flags[x.id]; saveSession(); render(); }
});

render();
</script>

</body></html>
